# Lints the index on every pull request that changes it, and checks each
# library the request adds. Runs the request's code with a read-only token and
# no secrets: `pull_request`, never `pull_request_target`.
name: index

on:
  pull_request:
    paths:
      - README.md
      - scripts/lint_index.py
      - .github/workflows/index.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test
        run: python3 scripts/lint_index.py --self-test

      - name: Form and order
        run: python3 scripts/lint_index.py README.md

      - name: Added libraries
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/lint_index.py --added "origin/$BASE_REF" README.md

      # TODO: install Dado and run `dado test` on each added library, on the
      # targets its dado.json claims, each in isolation with no token. Waits on
      # a settled release install path (T73: the index's CI builds the targets
      # `dado package` does not).
